# Frozen experiment protocol from docs/03_GRU_EURUSD_Volatility_Distillation.pdf.
# Change values here only, never inline in notebooks, so every run logs the same settings.

data:
  source: FRED
  series_id: DEXUSEU            # U.S. dollars per euro, daily
  start: "2000-01-01"
  end: "2025-12-31"
  snapshot_path: data/raw/DEXUSEU.csv
  interpolate_missing: false    # keep only observed dates

features:
  window: 60                    # previous 60 observations per example
  trailing_vol_windows: [5, 20]
  inputs: [log_return, squared_return, vol_5, vol_20]
  scaling: rolling_zscore        # 60 obs mean/std from origin day, past only
  scaling_window: 60

target:
  horizon: 5                    # core; 20 is the optional extension
  scaling: ratio_to_trailing_var # target / trailing 60 obs var, preds rescaled for eval

splits:
  train: ["2000-01-01", "2017-12-31"]
  validation: ["2018-01-01", "2020-12-31"]
  test: ["2021-01-01", "2025-12-31"]
  drop_examples_crossing_split: true

models:
  # Per-model optimizer settings; the shared training budget lives under training.
  teacher:
    num_layers: 3
    hidden_size: 128
    dropout: 0.4                # notebook 03 grid winner (teacher_grid.csv)
    learning_rate: 3.0e-4       # notebook 03 grid winner
    weight_decay: 1.0e-4        # tied with 1.0e-2 in the grid; used for the committed checkpoints
  student:
    num_layers: 1
    hidden_size: 32
    dropout: 0.0
    learning_rate: 1.0e-3       # placeholder until notebook 05 tunes the students
    weight_decay: 1.0e-4
  output_transform: softplus    # identical nonnegative head for all models

historical_control:
  window: 60                    # trailing mean squared return

training:
  optimizer: adamw
  batch_size: 32
  max_epochs: 100
  early_stopping_metric: val_mse
  early_stopping_patience: 10
  seeds: [0, 1, 2]
  grad_clip: 1.0                # max gradient norm, stabilizes rnn on heavy tailed targets

tuning:
  # Validation-only grids; copy each winner into models.<kind>.
  teacher:
    learning_rate: [1.0e-3, 3.0e-4, 1.0e-4]
    dropout: [0.2, 0.4]
    weight_decay: [1.0e-4, 1.0e-2]

distillation:
  alpha_grid: [0.25, 0.50, 0.75] # alpha = 0 is the direct-student control
  teacher_cache_split: train     # never cache teacher outputs on validation or test for training

evaluation:
  high_vol_quantile: 0.90       # cutoff fixed from training targets
  error_metric: mse             # MSE in original variance-proxy units (Patton 2011), never MAE
  min_improvement_retained: 0.90 # research target: student keeps >= 90% of the teacher's MSE gain over the historical control

benchmark:
  batch_size: 1
  warmup_runs: 50
  timed_runs: 1000
  devices: [cpu, cuda]
  num_threads: 1
  dtype: float32
